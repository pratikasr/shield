# Shield contracts. Foundry 1.8 or later is required for Monad execution (ADR-019).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.37"
evm_version = "prague"
# Monad gas model, opcode pricing and MIP-8 page accounting for tests, scripts and snapshots.
network = "monad"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
cbor_metadata = false
auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
  "aave-v3-origin/=lib/aave-v3-origin/src/",
]
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]
# Test runs leave snapshots/ alone (fork gas varies with the block); refresh the committed figures with
# FORGE_SNAPSHOT_EMIT=true forge snapshot (see README, Proof).
gas_snapshot_emit = false

[profile.default.fuzz]
runs = 512
seed = "0x5348494c44"

[profile.default.invariant]
runs = 128
depth = 40
fail_on_revert = false

[profile.ci.fuzz]
runs = 1024

# Monad testnet staging only (ADR-040): a full Aave V3 market from aave-v3-origin under testnet/, which needs that
# repository's nested submodules (`git submodule update --init --recursive contracts/lib/aave-v3-origin`). Kept out of
# the default build and CI, with its own output directory so the main artifacts and ABIs are untouched.
[profile.testnet]
src = "testnet"
test = "testnet"
script = "testnet"
out = "out-testnet"
cache_path = "cache-testnet"
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/aave-v3-origin/lib/solidity-utils/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
  "aave-v3-origin/=lib/aave-v3-origin/src/",
  "solidity-utils/=lib/aave-v3-origin/lib/solidity-utils/src/",
  "openzeppelin-contracts-upgradeable/=lib/aave-v3-origin/lib/solidity-utils/lib/openzeppelin-contracts-upgradeable/",
  "openzeppelin-contracts/=lib/aave-v3-origin/lib/solidity-utils/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/",
]

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110
number_underscore = "thousands"
sort_imports = true
