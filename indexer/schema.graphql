enum PositionStatus {
  Protected
  Unprotected
  OptedOut
  Exited
}

enum ForwarderSweepKind {
  Premium
  Vault
}

enum VaultFlowKind {
  Deposit
  Withdraw
  Premium
  ExitFunded
  CollateralReceived
  Unwound
}

"""One borrower's cover. Money fields are 18-decimal vault-asset units unless noted; HF values are x 1e18."""
type Position {
  id: ID!
  borrower: String! @index
  collateral: String!
  status: PositionStatus!
  trigger: Int!
  maxDiscountBps: Int!
  prepaid: BigInt!
  premiumPaid: BigInt!
  premiumPerBlock: BigInt!
  healthFactor: BigInt!
  sigma: BigInt!
  repriceCount: Int!
  optedInAt: BigInt!
  optedInTx: String!
  lastRepricedBlock: BigInt!
  exitedAt: BigInt
  reprices: [Reprice!]! @derivedFrom(field: "position")
  exits: [Exit!]! @derivedFrom(field: "position")
  prepaidFlows: [PrepaidFlow!]! @derivedFrom(field: "position")
}

"""A Repriced event. Money fields are 18-decimal vault-asset units."""
type Reprice {
  id: ID!
  position: Position!
  borrower: String! @index
  charged: BigInt!
  premiumPerBlock: BigInt!
  healthFactor: BigInt!
  sigma: BigInt!
  prepaid: BigInt!
  lapsed: Boolean!
  """The protocol's part of charged at the share in force (ADR-037); the vault's part is charged - protocolShare."""
  protocolShare: BigInt!
  blockNumber: BigInt! @index
  timestamp: BigInt!
  txHash: String!
  logIndex: Int!
}

"""An Exited event. repaid and savedVsAave are USDC units (6 decimals); seized is collateral units."""
type Exit {
  id: ID!
  position: Position!
  borrower: String! @index
  collateral: String!
  repaid: BigInt!
  seized: BigInt!
  savedVsAave: BigInt!
  healthFactorBefore: BigInt!
  healthFactorAfter: BigInt!
  flashLoanAmount: BigInt!
  """The borrower's trigger (HF x 1e4) when the exit ran: how close to it the exit landed."""
  trigger: Int!
  """Exit discount in force, bps; repaid x discountBps / 1e4 is the discount the vault side received."""
  discountBps: Int!
  blockNumber: BigInt! @index
  timestamp: BigInt!
  txHash: String!
}

"""
A top-up or withdrawal of prepaid premium, in USDC units. kind is "TopUp" (the borrower's own topUp), "CrossChainTopUp"
(USDC swept from the borrower's deposit address by ShieldForwarderFactory.sweepPremium: delivered by Aurora Intents
from another chain, or sent there on Monad) or "Withdraw".
"""
type PrepaidFlow {
  id: ID!
  position: Position!
  borrower: String! @index
  kind: String!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String! @index
}

"""Money moving in or out of the vault, in USDC units (collateral flows: aToken units in collateralAmount)."""
type VaultFlow {
  id: ID!
  kind: VaultFlowKind! @index
  account: String
  assets: BigInt!
  shares: BigInt!
  collateral: String
  collateralAmount: BigInt!
  blockNumber: BigInt! @index
  timestamp: BigInt!
  txHash: String!
}

"""Running vault totals, one row with id "vault". USDC units."""
type VaultStats {
  id: ID!
  deposited: BigInt!
  withdrawn: BigInt!
  premiumEarned: BigInt!
  exitsExecuted: Int!
  exitFunding: BigInt!
  collateralValueReceived: BigInt!
  depositors: Int!
}

"""A Pyth observation recorded into a feed's volatility window."""
type PriceSample {
  id: ID!
  feedId: String! @index
  price: BigInt!
  publishTime: BigInt!
  count: Int!
  blockNumber: BigInt!
}

type Depositor {
  id: ID!
  shares: BigInt!
}

"""
Owner-set parameters as last seen on chain, one row with id "config". Until the first ExitParamsSet or
ProtocolShareSet the values are the contracts' initial ones (exit discount 100 bps, buffer 600, dMin 100, share 0).
"""
type ProtocolConfig {
  id: ID!
  treasury: String
  protocolShareBps: Int!
  exitDiscountBps: Int!
  exitHfBuffer: Int!
  dMin: Int!
}

"""
Platform earnings and activity for one period: "all" (since deployment, start 0), "day" (one UTC day) or "hour".
Premium fields are 18-decimal USDC units as charged. protocolPaid, exitDiscount, debtRepaid, savedVsAave,
deposited and withdrawn are USDC units (6 decimals). exitDiscount is gross, at Aave's oracle price: a flash-assisted
exit pays its flash premium and swap cost out of it.
"""
type EarningsBucket {
  id: ID!
  period: String! @index
  start: BigInt! @index
  premiumCharged: BigInt!
  premiumToVault: BigInt!
  premiumToProtocol: BigInt!
  protocolPaid: BigInt!
  exitDiscount: BigInt!
  exits: Int!
  debtRepaid: BigInt!
  savedVsAave: BigInt!
  reprices: Int!
  optIns: Int!
  deposited: BigInt!
  withdrawn: BigInt!
}

"""
USDC swept from a deposit address (ADR-039), in USDC units. Premium: into the borrower's prepaid premium (the same
transaction's PrepaidFlow has kind "CrossChainTopUp"). Vault: deposited into the vault for the treasury, with the
shares minted; the vault's own Deposit event counts it in VaultStats and the earnings buckets.
"""
type ForwarderSweep {
  id: ID!
  kind: ForwarderSweepKind! @index
  """The borrower (Premium) or the treasury (Vault)."""
  account: String! @index
  forwarder: String!
  amount: BigInt!
  shares: BigInt!
  blockNumber: BigInt! @index
  timestamp: BigInt!
  txHash: String!
}

"""
A deposit address deployed by ShieldForwarderFactory, id the forwarder address. account is the borrower whose address
is the salt, or null for the treasury's deposit address (kind Vault).
"""
type Forwarder {
  id: ID!
  kind: ForwarderSweepKind!
  account: String @index
  salt: String!
  blockNumber: BigInt!
  txHash: String!
}

"""The protocol share of premiums paid to the treasury by a sweep, in USDC units."""
type ProtocolPayout {
  id: ID!
  treasury: String!
  amount: BigInt!
  blockNumber: BigInt! @index
  timestamp: BigInt!
  txHash: String!
}
